  <div class="grain" aria-hidden="true"></div>
  <main class="nf">
    <div class="nf__inner">
      <div class="console">
        <div class="console__bar">
          <span class="console__title"><span class="ms" aria-hidden="true">database</span>resume.db</span>

      <h1>Nothing to <em>select</em> here.</h1>

      <a class="btn btn--primary" href="/">Take me home</a>

  </main>
  <script>
    (function () {
      var path = decodeURIComponent(location.pathname).replace(/^\/+|\/+$/g, '').slice(0, 40) || 'this_page';
      var a = document.getElementById('nf-path');
      var b = document.getElementById('nf-rel');
      if (a) a.textContent = '"' + path + '"';
      if (b) b.textContent = path;
    })();
  </script>
